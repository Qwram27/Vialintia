appId: com.vialintia.studio
productName: Vialintia
copyright: Vialintia
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Vialintia-Setup-${version}.exe
  shortcutName: Vialintia
  createDesktopShortcut: true
portable:
  artifactName: Vialintia-${version}-portable.exe
